name: Deploy

# Publishes the public brochure/landing build to the gh-pages branch, served by
# GitHub Pages at https://oak-wildwood.github.io/cadre/. See
# docs/decisions/0004-public-site-hosting.md — this only ever covers the
# public brochure content, never the functional ledger UI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The Pages URL serves the repo under /cadre/, not the domain root,
          # so asset paths need the matching base. Unset for every other
          # build (self-hosted deploys serve from root).
          VITE_BASE_PATH: /cadre/

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
