name: Deploy

# Publishes the public brochure/landing build to GitHub Pages via GitHub's
# native Actions-based deployment (Settings → Pages → source: "GitHub
# Actions") — no gh-pages branch involved. See
# docs/decisions/0004-public-site-hosting.md — this only ever covers the
# public brochure content, never the functional ledger UI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The Pages URL serves the repo under /cadre/, not the domain root,
          # so asset paths need the matching base. Unset for every other
          # build (self-hosted deploys serve from root).
          VITE_BASE_PATH: /cadre/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
